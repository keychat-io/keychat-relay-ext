[package]
edition = "2021"
name = "keychat-relay-ext"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# grpc authorization server
[[bin]]
name = "keychat-relay-gas"
path = "src/gas.rs"

# storage authorization server
[[bin]]
name = "keychat-relay-sas"
path = "src/sas.rs"

[build-dependencies]
tonic-build = {version = "0.10", features = ["prost"]}

[dependencies]
cdk = { version = "=0.18.0", default-features = false, features = ["wallet"] }
cdk-common = { version = "=0.18.0", default-features = false, features = ["wallet"] }
cdk-sqlite = { version = "=0.18.0", default-features = false, features = ["wallet"] }
cdk-http-client = { version = "=0.18.0", default-features = false }
bip39 = "2.2"
sha2 = "0.10"
fs2 = "0.4"
zeroize = "1"

prost = "0.12"
tokio-stream = {version = "0.1.14", features = ["sync"]}
tonic = "0.10"
# url = {version = "2.4.0", features = ["serde"]}
#
dashmap = "6.0.1"
parking_lot = "0.12"
axum = {version = "0.7.4", features = []}
tower-http = { version = "0.5.0", features = ["trace"] }
dotenvy.workspace = true
rust-s3.workspace = true
aws-creds.workspace = true
http.workspace = true
base64-simd.workspace = true
url.workspace = true
#
flume.workspace = true
futures.workspace = true
tokio.workspace = true
#
anyhow.workspace = true
clap.workspace = true
faster-hex.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
uuid = "1"
