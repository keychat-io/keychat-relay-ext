# Secret-free SAS template. Stamp rules are deliberately absent.
enabled = true
listen = "127.0.0.1:3001"
database = "sas.cdk018.sqlite"
seed_env = "KEYCHAT_SAS_CASHU_MNEMONIC"
timeout_ms = 10000
allow_free = false
allow_pending = false
remote_ip_header = "X-Real-IP"

[fee]
unit = "sat"
mints = ["https://8333.space:3338/", "https://mint.keychat.io/"]
maxsize = 104857600
[[fee.prices]]
min = 0
max = 10485760
price = 1
[[fee.prices]]
min = 10485760
max = 104857600
price = 2

[input]
max_token_bytes = 65536
max_proofs = 128
max_amount = 1000000

[limits.cashu_failed]
secs = 60
allow = 20
